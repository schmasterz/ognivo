map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# HTTP server - redirect all traffic to HTTPS (port 443), allow /up
server {
    listen 80;
    server_name localhost;

    server_tokens off;

    # Internal /up healthcheck probe
    location = /up {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI /up;
        fastcgi_param DOCUMENT_URI /up;
        fastcgi_read_timeout 60;
    }

    # Redirect everything else to HTTPS (using 307 to avoid persistent browser caching on localhost during dev)
    location / {
        return 307 https://$host$request_uri;
    }
}

# HTTPS server - Production entrypoint on port 443
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Rate-limited auth endpoints
    location ~ ^/api/v1/(login|register) {
        limit_req zone=auth_limit burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 1. Route API, Sanctum authentication, OpenAPI docs and healthcheck (/up) to Laravel backend
    location ~ ^/(api|sanctum|docs|up) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Route Reverb WebSocket connections (restricted strictly to ^/app/)
    location ~ ^/app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }

    # Route Interactive Console WebSocket proxy connections
    location /console {
        proxy_pass http://console-proxy:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Process PHP requests via PHP-FPM container
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
    }

    # 2. Route all other traffic to Next.js frontend production server
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Block access to hidden files
    location ~ /\.ht {
        deny all;
    }
}
