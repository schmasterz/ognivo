map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # Set the root directory for Laravel public files
    root /var/www/html/public;
    index index.php index.html;

    # Character encoding
    charset utf-8;

    # Logs configuration
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Disable showing Nginx version for security
    server_tokens off;

    # 1. Route API, Sanctum authentication and OpenAPI docs requests to the Laravel backend
    location ~ ^/(api|sanctum|docs) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Route Reverb WebSocket connections
    location ~ ^/(app|apps) {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
    }

    # Route Interactive Console WebSocket proxy connections
    location /console {
        proxy_pass http://console-proxy:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Process PHP requests via PHP-FPM container
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Optimize timeouts for heavy LXD operations
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
    }

    # 2. Route all other traffic to the Next.js frontend development server
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;

        # Enable WebSockets support (Crucial for Next.js Hot Reloading & future noVNC console)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Block access to hidden files (e.g., .env)
    location ~ /\.ht {
        deny all;
    }
}
