name: ognivo

services:
  # 1. Database (MySQL 8.4 LTS - exposed on 127.0.0.1:3306 for local DB inspection)
  db:
    image: mysql:8.4
    container_name: ognivo-db-dev
    restart: always
    env_file:
      - .env.development
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ognivo}
      MYSQL_USER: ${DB_USERNAME:-ognivo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret_password}
      AUDIT_DB_USERNAME: ${AUDIT_DB_USERNAME:-audit_writer}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-}
      AUDIT_MAINT_DB_USERNAME: ${AUDIT_MAINT_DB_USERNAME:-audit_maintenance}
      AUDIT_MAINT_DB_PASSWORD: ${AUDIT_MAINT_DB_PASSWORD:-}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-migration_user}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
      AUDIT_STRICT_GRANTS: ${AUDIT_STRICT_GRANTS:-false}
    volumes:
      - db_data_dev:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - app-network-dev
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. Redis Cache & Queue Driver (Alpine)
  redis:
    image: redis:7-alpine
    container_name: ognivo-redis-dev
    restart: always
    command: redis-server --appendonly yes
    env_file:
      - .env.development
    networks:
      - app-network-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 3. Backend API (Laravel PHP-FPM, source mounted for live reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ognivo-backend:dev
    container_name: ognivo-backend-dev
    restart: always
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    env_file:
      - .env.development
    environment:
      AUDIT_DB_USERNAME: ${AUDIT_DB_USERNAME:-audit_writer}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-}
      AUDIT_MAINT_DB_USERNAME: ${AUDIT_MAINT_DB_USERNAME:-audit_maintenance}
      AUDIT_MAINT_DB_PASSWORD: ${AUDIT_MAINT_DB_PASSWORD:-}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-migration_user}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
      AUDIT_STRICT_GRANTS: ${AUDIT_STRICT_GRANTS:-false}
      AUDIT_HMAC_KEY_ID: ${AUDIT_HMAC_KEY_ID:-v1}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
      AUDIT_PSEUDONYM_SALT: ${AUDIT_PSEUDONYM_SALT:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-400}
      AUDIT_SEAL_DELAY_SECONDS: ${AUDIT_SEAL_DELAY_SECONDS:-120}
      AUDIT_ATTEMPTED_EMAIL_DAYS: ${AUDIT_ATTEMPTED_EMAIL_DAYS:-30}
      AUDIT_LOG_STDERR: ${AUDIT_LOG_STDERR:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network-dev
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 4. Laravel Queue Worker
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ognivo-backend:dev
    container_name: ognivo-queue-dev
    restart: always
    command: php artisan queue:work --verbose --tries=3 --timeout=600 --max-time=3600
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    env_file:
      - .env.development
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      AUDIT_DB_USERNAME: ${AUDIT_DB_USERNAME:-audit_writer}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-}
      AUDIT_MAINT_DB_USERNAME: ${AUDIT_MAINT_DB_USERNAME:-audit_maintenance}
      AUDIT_MAINT_DB_PASSWORD: ${AUDIT_MAINT_DB_PASSWORD:-}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-migration_user}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
      AUDIT_STRICT_GRANTS: ${AUDIT_STRICT_GRANTS:-false}
      AUDIT_HMAC_KEY_ID: ${AUDIT_HMAC_KEY_ID:-v1}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
      AUDIT_PSEUDONYM_SALT: ${AUDIT_PSEUDONYM_SALT:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-400}
      AUDIT_SEAL_DELAY_SECONDS: ${AUDIT_SEAL_DELAY_SECONDS:-120}
      AUDIT_ATTEMPTED_EMAIL_DAYS: ${AUDIT_ATTEMPTED_EMAIL_DAYS:-30}
      AUDIT_LOG_STDERR: ${AUDIT_LOG_STDERR:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network-dev

  # 5. Laravel Task Scheduler
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ognivo-backend:dev
    container_name: ognivo-scheduler-dev
    restart: always
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    env_file:
      - .env.development
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      AUDIT_DB_USERNAME: ${AUDIT_DB_USERNAME:-audit_writer}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-}
      AUDIT_MAINT_DB_USERNAME: ${AUDIT_MAINT_DB_USERNAME:-audit_maintenance}
      AUDIT_MAINT_DB_PASSWORD: ${AUDIT_MAINT_DB_PASSWORD:-}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-migration_user}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
      AUDIT_STRICT_GRANTS: ${AUDIT_STRICT_GRANTS:-false}
      AUDIT_HMAC_KEY_ID: ${AUDIT_HMAC_KEY_ID:-v1}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
      AUDIT_PSEUDONYM_SALT: ${AUDIT_PSEUDONYM_SALT:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-400}
      AUDIT_SEAL_DELAY_SECONDS: ${AUDIT_SEAL_DELAY_SECONDS:-120}
      AUDIT_ATTEMPTED_EMAIL_DAYS: ${AUDIT_ATTEMPTED_EMAIL_DAYS:-30}
      AUDIT_LOG_STDERR: ${AUDIT_LOG_STDERR:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network-dev

  # 6. Incus Lifecycle Events Listener
  incus-events:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ognivo-backend:dev
    container_name: ognivo-incus-events-dev
    restart: always
    command: php artisan incus:listen
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    env_file:
      - .env.development
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network-dev

  # 7. Laravel Reverb WebSocket Server
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ognivo-backend:dev
    container_name: ognivo-reverb-dev
    restart: always
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    env_file:
      - .env.development
    environment:
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      REVERB_ALLOWED_ORIGINS: "*"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network-dev
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 8. Frontend (Next.js development server with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ognivo-frontend:dev
    container_name: ognivo-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.development
    depends_on:
      - backend
    networks:
      - app-network-dev

  # 9. Web Server (Nginx HTTP for development)
  webserver:
    image: nginx:alpine
    container_name: ognivo-nginx-dev
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
      - reverb
      - console-proxy
    networks:
      - app-network-dev

  # 10. Interactive Console WebSocket Proxy
  console-proxy:
    build:
      context: ./console-proxy
      dockerfile: Dockerfile
    image: ognivo-console-proxy:dev
    container_name: ognivo-console-proxy-dev
    restart: always
    environment:
      PORT: 8085
      NODE_ENV: development
      ALLOW_FAKE_DRIVER: ${ALLOW_FAKE_DRIVER:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-ognivo-database-}
      APP_KEY: ${APP_KEY:-}
      APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
    volumes:
      - ./console-proxy:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network-dev

volumes:
  db_data_dev:

networks:
  app-network-dev:
    driver: bridge
