name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint & Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite
          coverage: none
          ini-values: memory_limit=1G

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style check (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Static analysis (Psalm)
        run: vendor/bin/psalm --no-progress

  backend-openapi:
    name: Backend OpenAPI Specification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite
          coverage: none
          ini-values: memory_limit=1G

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: OpenAPI specification analysis & export (Scramble)
        run: |
          php artisan scramble:analyze
          php artisan scramble:export --path=api.json

      - name: Upload OpenAPI specification artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: backend/api.json
          retention-days: 30

  backend-unit:
    name: Backend Unit & Feature Tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite
          coverage: none
          ini-values: memory_limit=1G

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Unit & Feature tests (SQLite)
        run: vendor/bin/pest --exclude-group=integration

  backend-integration:
    name: Backend Integration Tests (MySQL & Redis)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ognivo_test
        ports:
          - 33306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.4-alpine
        ports:
          - 16379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 33306
      DB_DATABASE: ognivo_test
      DB_USERNAME: root
      DB_PASSWORD: ""
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 16379
      REDIS_CLIENT: predis
      REDIS_QUEUE_RETRY_AFTER: 700
      # Audit DB users are created by `audit:grants` (runs as root via the migration connection).
      # MySQL 8 cannot implicitly create users via GRANT, so passwords must be non-empty here.
      AUDIT_DB_USERNAME: audit_writer
      AUDIT_DB_PASSWORD: ci_audit_writer_pw
      AUDIT_MAINT_DB_USERNAME: audit_maintenance
      AUDIT_MAINT_DB_PASSWORD: ci_audit_maint_pw
      AUDIT_STRICT_GRANTS: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, pcntl
          coverage: none
          ini-values: memory_limit=1G

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Database Migrations
        run: |
          php artisan migrate --force
          php artisan audit:grants --force

      - name: Run Integration Tests
        run: vendor/bin/pest --configuration=phpunit.integration.xml --group=integration

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  console-proxy:
    name: Console Proxy Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console-proxy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: console-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
